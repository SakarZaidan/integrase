[package]
name        = "integrase-sim"
description = "Biophysical models and calibrated uncertainty. No API here returns a bare predicted value."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
integrase-core = { path = "../integrase-core", version = "0.0.0" }
thiserror.workspace = true
serde.workspace     = true

[dev-dependencies]
# Temp files that clean themselves up on drop. Justified per R-3.1: the
# hand-rolled version leaked files when a test panicked, and ignoring the
# removal result tripped R-1.3's no-swallowed-errors rule. Already present
# transitively via proptest.
tempfile = "3"

[lints]
workspace = true
