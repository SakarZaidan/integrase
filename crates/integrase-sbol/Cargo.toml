[package]
name        = "integrase-sbol"
description = "SBOL interop for Integrase. A thin adapter over sbol-rs, not an SBOL implementation."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
integrase-core   = { path = "../integrase-core",   version = "0.0.0" }
integrase-screen = { path = "../integrase-screen", version = "0.0.0" }
sbol3     = "=1.0.0"
sbol-rdf  = "=1.0.0"
thiserror.workspace = true

[dev-dependencies]
sbol-convert = "=1.0.0"
sbol2        = "=1.0.0"
# Proves the export gate at COMPILE time. Runtime tests cannot: they can only
# show that screened designs export, never that unscreened ones cannot.
trybuild     = "1"

[lints]
workspace = true
