[project]
name            = "integrase"
version         = "0.0.0"
description     = "Genetic design with the error bars attached."
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "Apache-2.0" }
authors         = [{ name = "The Integrase Authors" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Repository = "https://github.com/SakarZaidan/integrase"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6", "pip-audit>=2"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integrase"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG", "ERA", "RUF"]
# ERA catches commented-out code, which is one of the tells the ai-code-review
# skill looks for.

[tool.mypy]
strict                     = true
warn_unreachable           = true
disallow_any_explicit      = false
# R-1.8: type hints on every public function, checked here rather than in review.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q --strict-markers"
