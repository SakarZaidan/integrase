[project]
name            = "integrase"
description     = "Genetic design with the error bars attached."
readme          = "README.md"
requires-python = ">=3.11"
license         = { text = "Apache-2.0" }
authors         = [{ name = "The Integrase Authors" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]
dependencies = []

[project.urls]
Repository = "https://github.com/SakarZaidan/integrase"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6", "pip-audit>=2", "maturin>=1.7"]

[build-system]
requires      = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# The Rust extension lives in the workspace; the Python package wraps it.
manifest-path    = "../crates/integrase-py/Cargo.toml"
module-name      = "integrase._integrase"
python-source    = "src"
# Enables the local feature, which in turn enables pyo3/extension-module.
# See crates/integrase-py/Cargo.toml for why it is not a default.
features         = ["extension-module"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG", "ERA", "RUF"]

[tool.mypy]
strict                = true
warn_unreachable      = true
disallow_any_explicit = false
# The compiled extension has no stubs yet; see src/integrase/_integrase.pyi.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q --strict-markers"
